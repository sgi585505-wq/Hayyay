<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aditya Army - Telegram Channel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      background: radial-gradient(circle at top, #222012 0%, #0a0a0a 70%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      padding: 15px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #141414;
      border: 1px solid rgba(255, 204, 0, 0.15);
      border-radius: 28px;
      padding: 30px 20px 25px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 204, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .top-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #b5b5b5;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .yellow-dot {
      width: 7px;
      height: 7px;
      background-color: #ffcc00;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffcc00;
    }

    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #ffcc00;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
    }

    .avatar-img {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      object-fit: cover;
      background: #1e1e1e;
    }

    .verified-check-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: #ffcc00;
      color: #000000;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #141414;
    }

    .main-heading {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .sub-description {
      font-size: 14px;
      color: #999999;
      line-height: 1.4;
      max-width: 280px;
      margin-bottom: 20px;
    }

    .verified-channel-tag {
      background: rgba(255, 204, 0, 0.08);
      border: 1px solid rgba(255, 204, 0, 0.3);
      color: #ffcc00;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 1.5px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .join-btn {
      width: 100%;
      background: linear-gradient(180deg, #ffcc00 0%, #e6b800 100%);
      color: #000000;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      padding: 16px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(255, 204, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 15px;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 204, 0, 0.45);
    }

    .status-text {
      font-size: 13px;
      color: #777777;
      margin-bottom: 25px;
    }

    .status-text span {
      color: #ffcc00;
      font-weight: 600;
    }

    .ref-code {
      font-size: 10px;
      color: #555555;
      letter-spacing: 2px;
      margin-bottom: 15px;
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 15px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .feature-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .feature-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .feature-sub {
      font-size: 9px;
      color: #666666;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="top-badge">
      <span class="yellow-dot"></span> ADITYA ARMY
    </div>

    <div class="avatar-wrapper">
      <div class="avatar-ring"></div>
      <!-- Aapki new image URL yahan add kar di gayi hai -->
      <img src="https://kommodo.ai/i/My741BPIWF4RkiIx6Zny" alt="aditya Army Profile" class="avatar-img">
      <div class="verified-check-badge">✓</div>
    </div>

    <h1 class="main-heading">aditya Army</h1>
    <p class="sub-description">Daily market levels and setups. Free to join.</p>

    <div class="verified-channel-tag">
      ★ VERIFIED CHANNEL
    </div>

    <a href="https://t.me/earnwithadityaaaa" class="join-btn" target="_blank" rel="noopener noreferrer">
      <span>✈</span> Join Now <span>➔</span>
    </a>

    <p class="status-text">Status: <span>Ready</span> · opens in Telegram</p>

    <div class="ref-code">REF E6253B</div>

    <div class="features-grid">
      <div class="feature-box">
        <span class="feature-title">24/7</span>
        <span class="feature-sub">ACTIVE</span>
      </div>
      <div class="feature-box">
        <span class="feature-title">Free</span>
        <span class="feature-sub">TO JOIN</span>
      </div>
      <div class="feature-box">
        <span class="feature-title">1-tap</span>
        <span class="feature-sub">ACCESS</span>
      </div>
    </div>
  </div>

</body>
</html>
